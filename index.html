      const numericValues = samples.filter(isNumericLikeValue).map(toNumberValue);
      const hasManyNumbers = numericValues.length >= Math.max(5, Math.ceil(samples.length * 0.7));
      if(hasManyNumbers && /montant|amount|total|valeur|value/.test(normalized)) return "D\u00e9pense";
      return null;
    }

    function makeUniqueHeaderLabel(raw, index, used, issues, lineNumber){
      const base = safeTrim(raw) || "Colonne " + (index + 1);
      const key = normalizePropertyName(base) || "colonne" + (index + 1);
      const count = used.get(key) || 0;
      used.set(key, count + 1);
      if(count === 0) return base;
      const renamed = base + " (" + (count + 1) + ")";
      addImportIssue(issues, createImportIssue("warning", "duplicate_header", "Colonne dupliquee renommee pour eviter un ecrasement de donnees.", lineNumber, base));
      return renamed;
    }

    function makeAnalysisReport(table, context = {}){
      const issues = mergeImportIssues(table?.issues || [], context?.issues || []);
      const isExcelSource = normalizePropertyName(table?.sourceKind || "") === "excel";
      const rows = cleanRows(table?.rows || []);
      if(!rows.length){
        addImportIssue(issues, createImportIssue("error", "empty_table", "Aucune donnee exploitable dans cette feuille."));
        return { rows: 0, cols: 0, score: 0, columns: [], sourceKind: table?.sourceKind || "table", sheetName: table?.name || "Feuille 1", sheetSummaries: [], issues, dataRows: [], headers: [], hasHeader: false };
      }
      const scanLimit = Math.min(18, rows.length);
      let bestHeaderIndex = -1, bestScore = -Infinity;
      for(let i = 0; i < scanLimit; i++){
        const score = scoreHeaderCandidate(rows[i], rows.slice(i + 1, i + 4));
        if(score > bestScore){ bestScore = score; bestHeaderIndex = i; }
      }
      const hasHeader = bestScore >= 3.5;
      if(!hasHeader) addImportIssue(issues, createImportIssue("warning", "header_inferred", "En-tete non fiable; des noms de colonnes generiques ont ete crees."));
      const headerRow = hasHeader ? rows[bestHeaderIndex] : [];
      const rawDataRows = hasHeader ? rows.slice(bestHeaderIndex + 1) : rows;
      const maxCols = Math.max(headerRow.length || 0, ...rawDataRows.map(row => row.length || 0));
      const usedHeaders = new Map();
      const headers = Array.from({ length: maxCols }, (_, index) => makeUniqueHeaderLabel(hasHeader ? headerRow[index] : "", index, usedHeaders, issues, headerRow.__lineNumber || 1));
      const dataRows = rawDataRows.map(row => {
        const normalized = Array.from({ length: maxCols }, (_, index) => {
          const value = row[index] ?? "";
          return isExcelSource && isBlankSpreadsheetCell(value) ? 0 : value;
        });
        normalized.__lineNumber = row.__lineNumber;
        return normalized;
      });
      dataRows.forEach(row => {
        const nonEmpty = row.filter(cell => safeTrim(cell) !== "").length;
        if(nonEmpty && nonEmpty < Math.max(1, Math.ceil(maxCols * 0.35))){
          addImportIssue(issues, createImportIssue("warning", "sparse_row", "Ligne tres incomplete conservee avec prudence.", row.__lineNumber, row.join(" | ")));
        }
      });
      const columns = headers.map((header, index) => {
        const samples = [];
        for(const row of dataRows){
          const value = row[index];
          if(value === undefined || value === null || safeTrim(value) === "") continue;
          samples.push(value);
          if(samples.length >= 80) break;
        }
        const role = inferFinancialRole(header, samples, context);
        const kind = inferColumnType(header, samples);
        const numericHits = samples.filter(isNumericLikeValue).length;
        const dateHits = samples.filter(v => parseLooseDate(v)).length;
        const nonEmpty = samples.filter(v => safeTrim(v) !== "").length || 1;
        const confidence = Math.max(
          role ? 82 : 45,
          kind.type === "date" ? Math.min(99, 72 + (dateHits / nonEmpty) * 27) :
          kind.type === "number" ? Math.min(98, 65 + (numericHits / nonEmpty) * 33) :
          Math.min(96, 54 + (samples.length > 0 ? 18 : 0) + (hasHeader ? 8 : 0))
        );
        const detailParts = [];
        if(role) detailParts.push("regle " + role);
        detailParts.push(kind.label);
        detailParts.push(samples.length + " echantillon" + (samples.length > 1 ? "s" : ""));
        if(dateHits) detailParts.push(dateHits + " date" + (dateHits > 1 ? "s" : ""));
        if(numericHits) detailParts.push(numericHits + " nombre" + (numericHits > 1 ? "s" : ""));
        return { index, label: header, roleLabel: role || (kind.type === "number" ? "Numerique" : "Texte"), typeLabel: kind.label, kind: kind.type, role, confidence, detail: detailParts.join(" - "), samples };
      });
      const mappedColumns = columns.filter(column => column.confidence > 60).length;
      const overallConfidence = Math.max(10, Math.min(99, bestScore + mappedColumns * 2 - issues.filter(issue => issue.severity === "warning").length * 0.25));
      return {
        rows: dataRows.length,
        cols: maxCols,
        score: overallConfidence,
        sourceKind: table?.sourceKind || "table",
        sheetName: table?.name || "Feuille 1",
        fileName: context.fileName || "",
        sheetSummaries: context.sheetSummaries || [],
        headerIndex: hasHeader ? bestHeaderIndex : null,
        columns,
        dataRows,
        headers,
        hasHeader,
        issues
      };
    }

    function canonicalPropertyName(column){
      const header = safeTrim(column?.label || "Colonne " + (Number(column?.index ?? 0) + 1));
      const normalized = normalizePropertyName(header);
      if(column?.kind === "date" || /^(mois|month|date|periode|period|jour|day)$/.test(normalized) || /date|mois|month|periode|period/.test(normalized)) return "Mois";
      if(/annee|year/.test(normalized)) return "Ann\u00e9e";
      if(column?.role === "Salaire" || /salaire|salary|income|revenu|remuneration|wage|paie/.test(normalized)) return "Salaire";
      return header || "Colonne " + (Number(column?.index ?? 0) + 1);
    }

    function columnAutoRule(column){
      const header = safeTrim(column?.label || "");
      const normalized = normalizePropertyName(header);
      if(column?.role === "Salaire" || /salaire|salary|income|revenu|remuneration|wage|paie/.test(normalized)) return "Salaire";
      if(column?.role === "\u00c9pargne" || /epargne|saving|savings|invest|investment|portfolio|wallet|placement|livret|pea|bourse|bourso/.test(normalized)) return "\u00c9pargne";
      if(column?.role === "D\u00e9pense" || /depense|charge|facture|loyer|expense|expenses|montant|amount|debit|transaction|operation|paiement|payment|withdrawal|retrait|frais|fee|spend|spent|achat|purchase/.test(normalized)) return "D\u00e9pense";
      if(column?.role === "Ignorer") return "Ignorer";
      return classifyFinancialProperty(header);
    }

    function buildPropertyValue(column, value, rowIndex, issues = [], lineNumber = null){
      if(value === undefined || value === null || safeTrim(value) === "") return null;
      const dateValue = parseLooseDate(value);
      if(column?.kind === "date"){
        if(dateValue) return { type: "date", date: { start: formatDateIsoLocal(dateValue) } };
        const fallback = safeTrim(value);
        addImportIssue(issues, createImportIssue("warning", "invalid_date_value", "Date invalide convertie en libelle texte.", lineNumber, value));
        return { type: "title", title: [{ plain_text: fallback || "Mois " + (rowIndex + 1) }] };
      }
      if(column?.kind === "number"){
        const parsed = toNumberValue(value);
        if(!Number.isFinite(parsed)){
          addImportIssue(issues, createImportIssue("warning", "invalid_number_value", "Nombre invalide ignore sans bloquer la ligne.", lineNumber, value));
          return null;
        }
        const autoRule = columnAutoRule(column);
        const confidence = autoRule && autoRule !== "Ignorer" ? 0.78 : 0.25;
        return numberProperty(parsed, autoRule, confidence, !autoRule || autoRule === "Ignorer");
      }
      const text = safeTrim(value);
      return text ? { type: "rich_text", rich_text: [{ plain_text: text }] } : null;
    }

    function normalizePropertyForRow(column, value, rowIndex, issues = [], lineNumber = null){
      const canonical = canonicalPropertyName(column);
      if(canonical === "Mois"){
        const dateValue = parseLooseDate(value);
        if(dateValue) return { name: "Mois", value: { type: "date", date: { start: formatDateIsoLocal(dateValue) } } };
        const text = safeTrim(value);
        addImportIssue(issues, createImportIssue("warning", "invalid_month_value", "Mois/date non reconnu; libelle texte utilise.", lineNumber, value));
        return { name: "Mois", value: { type: "title", title: [{ plain_text: text || "Mois " + (rowIndex + 1) }] } };
      }
      if(canonical === "Ann\u00e9e"){
        const num = toNumberValue(value);
        return { name: "Ann\u00e9e", value: Number.isFinite(num) ? { type: "number", number: num } : { type: "rich_text", rich_text: [{ plain_text: safeTrim(value) }] } };
      }
      const prop = buildPropertyValue(column, value, rowIndex, issues, lineNumber);
      return prop ? { name: canonical, value: prop } : null;
    }

    function assignMappedProperty(properties, name, value, issues, lineNumber){
      if(!name || !value) return false;
      let finalName = safeTrim(name);
      const base = finalName;
      let suffix = 2;
      while(Object.keys(properties).some(existing => normalizePropertyName(existing) === normalizePropertyName(finalName))){
        finalName = base + " " + suffix;
        suffix++;
      }
      if(finalName !== base){
        addImportIssue(issues, createImportIssue("warning", "mapping_collision", "Deux colonnes pointaient vers le meme champ; un nom unique a ete cree pour eviter l'ecrasement.", lineNumber, base));
      }
      properties[finalName] = value;
      return true;
    }

    function isImportableSheetAnalysis(item, totalSheets){
      const report = item?.report;
      if(!report || !(report.dataRows || []).length) return false;
      const sheetName = String(report.sheetName || item.name || "");
      const normalizedSheet = normalizePropertyName(sheetName);
      const yearNamed = /\b(19\d{2}|20\d{2}|21\d{2})\b/.test(sheetName);
      const noisySheet = /dashboard|tableaudebord|synthese|synthesis|resume|summary|param|config|notes|modele|template/.test(normalizedSheet);
      if(noisySheet && !yearNamed && totalSheets > 1) return false;
      if(report.importMode === "matrix") return true;
      if(totalSheets <= 1) return true;
      if(yearNamed) return true;
      if(report.importMode === "ledger") return item.selectionScore >= 240;
      if(report.importMode === "summary") return item.selectionScore >= 210;
      return false;
    }

    function attachWorkbookSummary(report, sheetSummaries, importedReports){
      if(!report) return report;
      report.sheetSummaries = sheetSummaries;
      report.importedSheetNames = (importedReports || []).map(item => item.sheetName || item.name || "Feuille");
      report.importedSheetCount = report.importedSheetNames.length;
      return report;
    }

    function analyzeWorkbookSheets(tables, context){
      const analyzedSheets = (tables || []).map(table => {
        const report = makeAnalysisReport(table, context);
        report.fileName = context?.fileName || "";
        report.sheetName = table.name || report.sheetName || "Feuille 1";
        report.importMode = detectImportMode(report);
        const modePriority = report.importMode === "matrix" ? 300 : report.importMode === "ledger" ? 220 : 120;
        const detailBonus = /\b(19\d{2}|20\d{2}|21\d{2})\b/.test(String(report.sheetName || "")) ? 35 : 0;
        const synthesisPenalty = /synthese|synthesis|dashboard|resume|summary/.test(normalizePropertyName(report.sheetName || "")) ? -45 : 0;
        const selectionScore = modePriority + detailBonus + synthesisPenalty + Math.min(report.rows || 0, 80) + Math.min(report.cols || 0, 30) + (report.score || 0) / 10;
        return { name: table.name || "Feuille 1", rows: report.rows, cols: report.cols, score: report.score, selectionScore, mode: report.importMode, sourceKind: report.sourceKind, issues: report.issues || [], report };
      }).sort((a, b) => b.selectionScore - a.selectionScore || b.rows - a.rows || b.cols - a.cols || b.score - a.score);
      const sheetSummaries = analyzedSheets.map(({ report, ...summary }) => summary);
      const importableReports = analyzedSheets
        .filter(item => isImportableSheetAnalysis(item, analyzedSheets.length))
        .map(item => attachWorkbookSummary(item.report, sheetSummaries, analyzedSheets.filter(other => isImportableSheetAnalysis(other, analyzedSheets.length)).map(other => other.report)));
      const chosen = attachWorkbookSummary(importableReports[0] || analyzedSheets[0]?.report || null, sheetSummaries, importableReports);
      return { chosen, sheetSummaries, importableReports };
    }

    function tableFromXlsxWorkbook(workbook){
      const sheets = [];
      (workbook?.SheetNames || []).forEach(name => {
        const sheet = workbook.Sheets?.[name];
        if(!sheet) return;
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "", blankrows: false });
        rows.forEach((row, index) => { if(Array.isArray(row)) row.__lineNumber = index + 1; });
        sheets.push({ name, rows, sourceKind: "Excel", issues: [] });
      });
      return sheets;
    }

    function tableFromTextFile(fileName, text, inheritedIssues = []){
      const extension = (fileName.split(".").pop() || "").toLowerCase();
      const trimmed = String(text || "").trim();
      const issues = mergeImportIssues(inheritedIssues);
      if(!trimmed){
        addImportIssue(issues, createImportIssue("error", "empty_text_file", "Le fichier texte ne contient aucune donnee."));
        return [{ name: "Texte", rows: [], sourceKind: "Texte", issues }];
      }
      if(extension === "json" || trimmed.startsWith("[") || trimmed.startsWith("{")){
        try{
          const parsed = JSON.parse(trimmed);
          return [{ name: "JSON", rows: jsonToRows(parsed), sourceKind: "JSON", issues }];
        }catch(err){
          addImportIssue(issues, createImportIssue("warning", "json_parse_failed", "JSON invalide; tentative de lecture comme texte delimite.", null, err?.message || ""));
        }
      }
      if(extension === "xml" || trimmed.startsWith("<?xml") || /<([a-z][\w:-]*)(\s|>)/i.test(trimmed)){
        const rows = xmlToRows(trimmed);
        if(rows.length) return [{ name: "XML", rows, sourceKind: "XML", issues }];
        const htmlRows = htmlTableToRows(trimmed);
        if(htmlRows.length) return [{ name: "HTML", rows: htmlRows, sourceKind: "HTML", issues }];
        if(extension === "xml" || extension === "html" || extension === "htm") addImportIssue(issues, createImportIssue("warning", "markup_without_table", "Balises detectees mais aucun tableau exploitable; lecture CSV tentee."));
      }
      const parsed = rowsFromDelimitedText(trimmed);
      return [{ name: parsed.sheetName || "CSV", rows: parsed.rows, sourceKind: extension === "tsv" ? "TSV" : "CSV", delimiter: parsed.delimiter, issues: mergeImportIssues(issues, parsed.issues || []) }];
    }

    function tableFromFile(file, workbook){
      if(workbook) return tableFromXlsxWorkbook(workbook);
      return tableFromTextFile(file.name, file._text || "", file._analysisIssues || []);
    }

    function extractYearFromText(...values){
      for(const value of values){
        const match = safeTrim(value).match(/\b(19\d{2}|20\d{2}|21\d{2})\b/);
        if(match) return Number(match[1]);
      }
      return null;
    }

    function matrixContextYear(analysis, fileName, sheetName){
      const rowText = (analysis?.dataRows || []).slice(0, 12).map(row => (Array.isArray(row) ? row.join(" ") : "")).join(" ");
      return extractYearFromText(sheetName, fileName, rowText) || new Date().getFullYear();
    }

    function monthDateFromLabel(label, year){
      const text = safeTrim(label);
      if(!text || /total|somme|bilan|reste|solde|balance/i.test(text)) return null;
      const explicit = parseLooseDate(text);
      if(explicit && /\b(19\d{2}|20\d{2}|21\d{2})\b/.test(text)) return monthKeyFromDate(explicit);
      const monthNumber = monthNumberFromText(text);
      if(!monthNumber) return null;
      return makeValidDate(Number(year) || new Date().getFullYear(), monthNumber, 1);
    }

    function getMatrixDescriptorColumn(analysis){
      const columns = analysis?.columns || [];
      return columns.find(column => /categorie|category|poste|libelle|label|description|nom|name/.test(normalizePropertyName(getColumnText(column))))
        || pickBestColumn(columns, scoreTextColumn);
    }

    function getMatrixMonthColumns(analysis, fileName, sheetName){
      const year = matrixContextYear(analysis, fileName, sheetName);
      const labelColumn = getMatrixDescriptorColumn(analysis);
      const monthColumns = (analysis?.columns || [])
        .filter(column => column.index !== labelColumn?.index)
        .map(column => ({ column, date: monthDateFromLabel(getColumnText(column), year) }))
        .filter(item => item.date);
      return { labelColumn, monthColumns, year };
    }

    function isMatrixAnalysis(analysis, fileName = "", sheetName = ""){
      const { labelColumn, monthColumns } = getMatrixMonthColumns(analysis, fileName, sheetName);
      if(!labelColumn || monthColumns.length < 1) return false;
      const labels = (analysis?.dataRows || []).map(row => normalizePropertyName(row?.[labelColumn.index])).filter(Boolean);
      const hasFinancialRows = labels.some(label => /salaire|revenu|depense|charge|loyer|epargne|livret|bourse|pea|bilan/.test(label));
      return hasFinancialRows;
    }

    function pickBestColumn(columns, scorer, excludedIndexes = new Set()){
      return (columns || [])
        .filter(column => !excludedIndexes.has(column.index))
        .map(column => ({ column, score: Number(scorer(column)) || 0 }))
        .sort((a, b) => b.score - a.score || a.column.index - b.column.index)[0]?.column || null;
    }

    function detectImportMode(analysis){
      const columns = analysis?.columns || [];
      const rows = analysis?.dataRows || [];
      if(isMatrixAnalysis(analysis, analysis?.fileName || "", analysis?.sheetName || "")) return "matrix";
      const dateCol = pickBestColumn(columns, scoreDateColumn);
      const amountLikeCols = columns.filter(c => scoreAmountColumn(c) >= 4.5);
      const textLikeCols = columns.filter(c => scoreTextColumn(c) >= 4);
      const hasSummaryMarkers = columns.some(c => /salaire|salary|revenu|income|epargne|budget|objectif|objective/.test(normalizePropertyName(getColumnText(c))));
      const hasTransactionMarkers = columns.some(c => /transaction|operation|libell|label|merchant|categorie|category|description|beneficiaire|tiers/.test(normalizePropertyName(getColumnText(c))));
      if(dateCol && amountLikeCols.length >= 1 && rows.length >= 2 && (hasTransactionMarkers || textLikeCols.length >= 1)) return "ledger";
      if(hasSummaryMarkers || amountLikeCols.length >= 3) return "summary";
      if(dateCol && amountLikeCols.length === 1 && rows.length >= 6) return "ledger";
      return "summary";
    }

    function detectMatrixSection(label, currentSection){
      const normalized = normalizePropertyName(label);
      if(!normalized) return currentSection;
      if(/revenu|income|recette/.test(normalized)) return "income";
      if(/depense|charge|expense|cout|co[uû]t/.test(normalized)) return "expense";
      if(/epargne|saving|savings|placement|patrimoine/.test(normalized)) return "saving";
      if(/bilan|reste|disponible|solde|balance/.test(normalized)) return "balance";
      return currentSection;
    }

    function shouldSkipMatrixRow(label){
      const normalized = normalizePropertyName(label);
      if(!normalized) return true;
      if(/soustotal|subtotal|totalrevenu|totaldepense|totalepargne|total|bilanmensuel|restedisponible|indicateur|navigue|info/.test(normalized)) return true;
      return /^(revenus|epargne|bilan)$/.test(normalized);
    }

    function cleanMatrixLabel(label){
      return safeTrim(label).replace(/^[^\p{L}\p{N}]+/u, "").replace(/\s+/g, " ").trim() || "Autres";
    }

    function matrixPropertyMeta(label, section){
      const clean = cleanMatrixLabel(label);
      const normalized = normalizePropertyName(clean);
      if(/salaire|salary|paie|pay/.test(normalized)) return { name: "Salaire", rule: "Salaire", confidence: 0.99 };
      if(/reste|solde|balance|disponible/.test(normalized)) return { name: clean, rule: "Ignorer", confidence: 0.35, needsReview: true };
      if(/epargne|livret|pea|bourse|placement|saving|savings|invest|patrimoine/.test(normalized)) return { name: clean, rule: "\u00c9pargne", confidence: 0.9 };
      if(/compte|revolut|bourso|boursobank|bank|banque/.test(normalized)) return { name: clean, rule: "\u00c9pargne", confidence: 0.48, needsReview: true };
      if(/depense|charge|loyer|carte|vacance|frais|fee|expense|achat|course|abonnement|assurance|impot|taxe/.test(normalized)) return { name: clean, rule: "D\u00e9pense", confidence: 0.9 };
      if(section === "expense") return { name: clean, rule: "D\u00e9pense", confidence: 0.72 };
      if(section === "saving") return { name: clean, rule: "\u00c9pargne", confidence: 0.72 };
      if(section === "income") return null;
      return { name: clean, rule: "Ignorer", confidence: 0.15, needsReview: true };
    }

    function numberProperty(value, rule, confidence = 0.8, needsReview = false){
      return {
        type: "number",
        number: Math.abs(Number(value) || 0),
        _autoRule: rule || "Ignorer",
        _autoConfidence: confidence,
        _needsReview: Boolean(needsReview || !rule || rule === "Ignorer" || confidence < 0.55)
      };
    }

    function inferPropertyRule(propName, prop){
      if(prop && typeof prop === "object" && prop._autoRule) return prop._autoRule;
      return classifyFinancialProperty(propName);
    }

    function inferPropertyConfidence(propName, prop){
      if(prop && typeof prop === "object" && Number.isFinite(Number(prop._autoConfidence))) return Number(prop._autoConfidence);
      const ex = classifyFinancialPropertyEx(propName);
      if(!ex.rule || ex.rule === "Ignorer") return 0.2;
      return ex.matched ? 0.85 : 0.2;
    }

    function propertyNeedsReview(propName, prop){
      if(prop && typeof prop === "object" && prop._needsReview) return true;
      if(isMetaPropertyName(propName)) return false;
      const auto = inferPropertyRule(propName, prop);
      const confidence = inferPropertyConfidence(propName, prop);
      return !auto || auto === "Ignorer" || confidence < 0.55;
    }

    function buildMatrixPagesFromAnalysis(analysis, fileName, sheetName){
      const issues = analysis.issues || [];
      const { labelColumn, monthColumns } = getMatrixMonthColumns(analysis, fileName, sheetName);
      if(!labelColumn || !monthColumns.length){
        addImportIssue(issues, createImportIssue("warning", "matrix_mapping_failed", "Tableau mois-en-colonnes non reconnu; bascule en mode synthese."));
        return buildSummaryPagesFromAnalysis(analysis, fileName, sheetName);
      }
      const pages = [];
      monthColumns.forEach(({ column, date }, monthIndex) => {
        const properties = { Mois: { type: "date", date: { start: formatDateIsoLocal(date) } } };
        let section = null;
        let mapped = 0;
        (analysis?.dataRows || []).forEach(row => {
          const label = row?.[labelColumn.index];
          const cleanLabel = cleanMatrixLabel(label);
          const rowHasNumericValue = monthColumns.some(({ column }) => Number.isFinite(toNumberValue(row?.[column.index])) && toNumberValue(row?.[column.index]) !== 0);
          if(!rowHasNumericValue) section = detectMatrixSection(cleanLabel, section);
          if(shouldSkipMatrixRow(cleanLabel)) return;
          const meta = matrixPropertyMeta(cleanLabel, section);
          if(!meta) return;
          const value = toNumberValue(row?.[column.index]);
          if(!Number.isFinite(value)) return;
          assignMappedProperty(properties, meta.name, numberProperty(value, meta.rule, meta.confidence, meta.needsReview), issues, row?.__lineNumber);
          mapped++;
        });
        if(mapped > 0){
          pages.push({ id: "import-" + normalizePropertyName(fileName || "file") + "-" + normalizePropertyName(sheetName || "sheet") + "-matrix-" + (monthIndex + 1), properties });
        }else{
          addImportIssue(issues, createImportIssue("info", "empty_matrix_month", "Colonne mois ignoree car aucune valeur financiere exploitable.", null, getColumnText(column)));
        }
      });
      if(!pages.length) addImportIssue(issues, createImportIssue("warning", "matrix_no_pages", "Aucun mois exploitable dans le tableau matriciel."));
      return pages;
    }

    function buildSummaryPagesFromAnalysis(analysis, fileName, sheetName){
      const pages = [];
      const issues = analysis.issues || [];
      (analysis?.dataRows || []).forEach((row, rowIndex) => {
        try{
          const properties = {};
          const normalizedRow = Array.isArray(row) ? row : [];
          let hasAny = false;
          (analysis.columns || []).forEach(column => {
            const cell = normalizedRow[column.index];
            if(cell === undefined || cell === null || safeTrim(cell) === "") return;
            const prop = normalizePropertyForRow(column, cell, rowIndex, issues, normalizedRow.__lineNumber);
            if(!prop) return;
            if(assignMappedProperty(properties, prop.name, prop.value, issues, normalizedRow.__lineNumber)) hasAny = true;
          });
          if(!hasAny){
            addImportIssue(issues, createImportIssue("warning", "row_without_mappable_data", "Ligne ignoree: aucune donnee exploitable apres validation.", normalizedRow.__lineNumber, normalizedRow.join(" | ")));
            return;
          }
          if(!Object.keys(properties).some(name => normalizePropertyName(name) === normalizePropertyName("Mois"))){
            const firstDate = (analysis.columns || []).map(col => normalizedRow[col.index]).find(v => parseLooseDate(v));
            const parsed = parseLooseDate(firstDate);
            if(parsed) properties.Mois = { type: "date", date: { start: formatDateIsoLocal(parsed) } };
            else{
              const firstText = getRowFirstText(normalizedRow);
              properties.Mois = { type: "title", title: [{ plain_text: firstText || "Mois " + (rowIndex + 1) }] };
              addImportIssue(issues, createImportIssue("warning", "missing_month", "Aucune date fiable; libelle de mois genere.", normalizedRow.__lineNumber, firstText));
            }
          }
          pages.push({ id: "import-" + normalizePropertyName(fileName || "file") + "-" + normalizePropertyName(sheetName || "sheet") + "-" + (rowIndex + 1), properties });
        }catch(err){
          addImportIssue(issues, createImportIssue("warning", "row_parse_exception", "Ligne ignoree apres erreur locale: " + (err?.message || err), row?.__lineNumber, Array.isArray(row) ? row.join(" | ") : ""));
        }
      });
      return pages;
    }

    function coerceLedgerAmount(row, amountColumns, fallbackColumns, dateCol){
      const candidates = [...amountColumns, ...fallbackColumns].filter((column, index, all) => column && column.index !== dateCol?.index && all.findIndex(other => other.index === column.index) === index);
      for(const column of candidates){
        const raw = row[column.index];
        const parsed = toNumberValue(raw);
        if(!Number.isFinite(parsed) || parsed === 0) continue;
        const label = normalizePropertyName(getColumnText(column));
        let value = parsed;
        if(/debit|depense|retrait|withdrawal|payment|paiement/.test(label) && parsed > 0) value = -Math.abs(parsed);
        if(/credit|income|revenu|salaire|deposit|versement/.test(label) && parsed > 0) value = Math.abs(parsed);
        return { value, raw, column };
      }
      return { value: NaN, raw: "", column: null };
    }

    function buildLedgerPagesFromAnalysis(analysis, fileName, sheetName){
      const columns = analysis?.columns || [];
      const rows = analysis?.dataRows || [];
      const issues = analysis.issues || [];
      if(!columns.length || !rows.length) return [];
      const dateCol = pickBestColumn(columns, scoreDateColumn);
      const amountColumns = columns.filter(c => c.index !== dateCol?.index && scoreAmountColumn(c) >= 4.5).sort((a, b) => scoreAmountColumn(b) - scoreAmountColumn(a));
      const amountCol = amountColumns[0] || pickBestColumn(columns, scoreAmountColumn, new Set([dateCol?.index]));
      const excluded = new Set([dateCol?.index, amountCol?.index].filter(Number.isFinite));
      const categoryCol = pickBestColumn(columns, scoreTextColumn, excluded);
      const labelCol = (columns || []).find(c => !excluded.has(c.index) && /libell|label|description|merchant|beneficiaire|transaction|operation/.test(normalizePropertyName(getColumnText(c)))) || categoryCol;
      if(!dateCol || !amountCol || dateCol.index === amountCol.index){
        addImportIssue(issues, createImportIssue("warning", "ledger_mapping_failed", "Colonnes date/montant non distinctes; bascule en mode synthese."));
        return buildSummaryPagesFromAnalysis(analysis, fileName, sheetName);
      }

      const buckets = new Map();
      const fallbackAmountColumns = columns.filter(c => c !== dateCol && c !== categoryCol && c !== labelCol);

      function ensureBucket(key, date){
        if(!buckets.has(key)){
          buckets.set(key, { date, salary: 0, expenses: 0, savings: 0, expenseDetails: new Map(), savingsDetails: new Map(), incomeDetails: new Map(), notes: [], rowCount: 0 });
        }
        return buckets.get(key);
      }

      rows.forEach((row) => {
        const normalizedRow = Array.isArray(row) ? row : [];
        try{
          const parsedDate = parseLooseDate(normalizedRow[dateCol.index]);
          const bucketDate = monthKeyFromDate(parsedDate);
          if(!bucketDate){
            addImportIssue(issues, createImportIssue("warning", "ledger_row_bad_date", "Transaction ignoree: date invalide.", normalizedRow.__lineNumber, normalizedRow[dateCol.index]));
            return;
          }
          const amountChoice = coerceLedgerAmount(normalizedRow, amountColumns.length ? amountColumns : [amountCol], fallbackAmountColumns, dateCol);
          let amount = amountChoice.value;
          if(!Number.isFinite(amount) || amount === 0){
            addImportIssue(issues, createImportIssue("warning", "ledger_row_bad_amount", "Transaction ignoree: montant invalide.", normalizedRow.__lineNumber, amountChoice.raw));
            return;
          }
          const key = formatDateIsoLocal(bucketDate);
          const bucket = ensureBucket(key, bucketDate);
          const categoryText = getRowFirstText(normalizedRow, [categoryCol?.index, labelCol?.index]) || "Autres";
          const rowText = [categoryText, getColumnText(categoryCol), getColumnText(labelCol), getColumnText(amountChoice.column || amountCol)].filter(Boolean).join(" ");
          const rowKind = inferFinancialRole(rowText, [amountChoice.raw], { fileName, sheetName }) || "";
          const amountAbs = Math.abs(amount);
          const categoryNorm = normalizePropertyName(categoryText);
          const isSavings = /epargne|saving|savings|invest|investment|livret|wallet|crypto|placement|transfer|virement/.test(categoryNorm) || rowKind === "\u00c9pargne";
          const isIncome = /salaire|salary|income|revenu|pay|paie|remuneration|bonus|refund|credit|deposit|versement/.test(categoryNorm) || rowKind === "Salaire" || amount > 0 && /credit|income|revenu|salaire|deposit|versement/.test(normalizePropertyName(getColumnText(amountChoice.column)));
          const isExpense = !isSavings && (amount < 0 || /depense|expense|achat|purchase|fee|frais|retrait|withdrawal|payment|debit|bill|facture|tax|impot|loyer|rent|restaurant|food|course|transport|travel|voyage|subscription|abonnement/.test(categoryNorm) || rowKind === "D\u00e9pense");
          const normalizedName = safeTrim(categoryText) || "Autres";
          if(isSavings){
            bucket.savings += amountAbs;
            bucket.savingsDetails.set(normalizedName, (bucket.savingsDetails.get(normalizedName) || 0) + amountAbs);
          }else if(isIncome){
            bucket.salary += amountAbs;
            bucket.incomeDetails.set(normalizedName, (bucket.incomeDetails.get(normalizedName) || 0) + amountAbs);
          }else if(isExpense || amountAbs > 0){
            bucket.expenses += amountAbs;
            bucket.expenseDetails.set(normalizedName, (bucket.expenseDetails.get(normalizedName) || 0) + amountAbs);
          }
          bucket.rowCount += 1;
          if(normalizedName && bucket.notes.length < 8) bucket.notes.push(normalizedName + ": " + formatEuro(amountAbs));
        }catch(err){
          addImportIssue(issues, createImportIssue("warning", "ledger_row_exception", "Transaction ignoree apres erreur locale: " + (err?.message || err), normalizedRow.__lineNumber, normalizedRow.join(" | ")));
        }
      });

      return Array.from(buckets.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([key, bucket], idx) => {
        const properties = { Mois: { type: "date", date: { start: key } } };
        if(bucket.salary > 0) properties.Salaire = { type: "number", number: bucket.salary };
        if(bucket.expenses > 0) properties["D\u00e9penses globales"] = { type: "number", number: bucket.expenses };
        if(bucket.savings > 0) properties["\u00c9pargne globale"] = { type: "number", number: bucket.savings };
        Array.from(bucket.expenseDetails.entries()).forEach(([name, value]) => assignMappedProperty(properties, safeTrim(name) || "Autres", numberProperty(value, "D\u00e9pense", 0.88), issues, null));
        Array.from(bucket.savingsDetails.entries()).forEach(([name, value]) => assignMappedProperty(properties, safeTrim(name) || "Autres", numberProperty(value, "\u00c9pargne", 0.88), issues, null));
        Array.from(bucket.incomeDetails.entries()).forEach(([name, value]) => {
          const safeName = safeTrim(name) || "Revenu";
          if(normalizePropertyName(safeName) !== normalizePropertyName("Salaire")) assignMappedProperty(properties, safeName, numberProperty(value, "Salaire", 0.82), issues, null);
        });
        const notes = bucket.notes.slice(0, 4).join(" - ");
        if(notes) properties["Grosses d\u00e9penses"] = { type: "rich_text", rich_text: [{ plain_text: notes }] };
        return { id: "import-" + normalizePropertyName(fileName || "file") + "-" + normalizePropertyName(sheetName || "sheet") + "-" + (idx + 1), properties };
      });
    }

    function buildPagesFromAnalysis(analysis, fileName, sheetName){
      const issues = analysis.issues || [];
      const mode = detectImportMode(analysis);
      const pages = mode === "matrix"
        ? buildMatrixPagesFromAnalysis(analysis, fileName, sheetName)
        : mode === "ledger"
          ? buildLedgerPagesFromAnalysis(analysis, fileName, sheetName)
          : buildSummaryPagesFromAnalysis(analysis, fileName, sheetName);
      const validPages = pages.filter(page => page && page.properties && Object.keys(page.properties).length > 0);
      // Attache l'année du nom de feuille à toutes les pages
      const sheetYear = extractYearFromText(sheetName) || extractYearFromText(fileName);
      if(sheetYear){
        validPages.forEach(page => {
          // Ajoute la propriété Année
          if(!page.properties["Ann\u00e9e"] && !page.properties["Annee"] && !page.properties["Year"]){
            page.properties["Ann\u00e9e"] = { type: "rich_text", rich_text: [{ type: "text", text: String(sheetYear), plain_text: String(sheetYear) }] };
          }
          // Corrige l'année du Mois si elle est incorrecte
          const moisProp = page.properties["Mois"];
          if(moisProp && moisProp.type === "date" && moisProp.date && moisProp.date.start){
            var d = parseIsoDateLocal(moisProp.date.start);
            if(d && d.getFullYear() !== sheetYear){
              d.setFullYear(sheetYear);
              moisProp.date.start = formatDateIsoLocal(d);
            }
          }
        });
      }
      if(!validPages.length) addImportIssue(issues, createImportIssue("error", "no_pages_after_mapping", "Aucune ligne n'a pu etre mappee apres validation."));
      analysis.importMode = mode;
      return validPages;
    }

    function buildPagesFromWorkbookBundle(bundle, fileName){
      const reports = (bundle?.importableReports || []).length ? bundle.importableReports : (bundle?.chosen ? [bundle.chosen] : []);
      const pages = [];
      const analyses = [];
      const issues = [];
      reports.forEach(analysis => {
        if(!analysis) return;
        const sheetName = analysis.sheetName || "Feuille";
        const sheetPages = buildPagesFromAnalysis(analysis, fileName, sheetName);
        if(sheetPages.length){
          pages.push(...sheetPages);
          analyses.push(analysis);
        }
        (analysis.issues || []).forEach(issue => addImportIssue(issues, issue));
      });
      const importedSheets = analyses.map(analysis => analysis.sheetName || "Feuille");
      const processedRows = analyses.reduce((total, analysis) => total + Number((analysis.dataRows || []).length || analysis.rows || 0), 0);
      const maxCols = analyses.reduce((max, analysis) => Math.max(max, Number(analysis.cols || 0)), 0);
      const modes = Array.from(new Set(analyses.map(analysis => analysis.importMode).filter(Boolean)));
      return {
        pages,
        analyses,
        issues,
        importedSheets,
        processedRows,
        maxCols,
        importMode: modes.length > 1 ? "mixed" : (modes[0] || bundle?.chosen?.importMode || "summary")
      };
    }

    function buildCategoryModel(pages){
      const propRules = getPropertyRules();
      const avail = getAvailableRules();
      const detected = new Map();
      pages.forEach(page => {
        Object.entries(page.properties || {}).forEach(([pname, prop]) => {
          if(!isNumberLikeProperty(prop)) return;
          if(isMetaPropertyName(pname)) return;
          const rkey = normalizePropertyName(pname);
          const auto = inferPropertyRule(pname, prop) || "Ignorer";
          const confidence = inferPropertyConfidence(pname, prop);
          const needsReview = propertyNeedsReview(pname, prop);
          const saved = migrateRuleValue(propRules[rkey] || "auto");
          const eff = saved === "auto" ? auto : saved;
          const color = getRuleColor(eff || auto || "Ignorer");
          if(!detected.has(pname)){
            detected.set(pname, {
              id: rkey,
              propertyName: pname,
              name: safeTrim(pname),
              automaticRule: needsReview ? "À confirmer" : auto,
              detectedRule: auto,
              savedRule: saved,
              rule: eff || "Ignorer",
              color,
              confidence,
              needsReview
            });
          }
        });
      });
      return {
        detectedProperties: Array.from(detected.values()).sort(sortDetectedProperties),
        availableRules: avail
      };
    }

    function sortDetectedProperties(a, b){
      if(Boolean(a.needsReview) !== Boolean(b.needsReview)) return a.needsReview ? -1 : 1;
      const order = { "D\u00e9pense": 0, "Épargne": 1, "Salaire": 2, "Bourse": 3, "Ignorer": 4, "À confirmer": -1 };
      const ak = a.detectedRule || a.rule || "Ignorer";
      const bk = b.detectedRule || b.rule || "Ignorer";
      const ao = order[ak] ?? 99;
      const bo = order[bk] ?? 99;
      return ao !== bo ? ao - bo : a.name.localeCompare(b.name, "fr");
    }

    function renderCategorySettings(){
      elements.categorySettings.hidden = state.detectedProperties.length === 0;
      elements.categorySettingsList.innerHTML = "";
      const title = elements.categorySettings?.querySelector(".category-settings-title h3");
      if(title) title.textContent = "Cat\u00e9gories d\u00e9tect\u00e9es (" + state.detectedProperties.length + ")";
      const avail = getAvailableRules();
      state.detectedProperties.forEach(prop => {
        const row = document.createElement("div");
        row.className = "category-row" + (prop.needsReview ? " category-row-review" : "");
        const nameDiv = document.createElement("div");
        nameDiv.className = "category-name";
        const swatch = document.createElement("span");
        swatch.className = "category-color";
        swatch.style.background = getRuleColor(prop.rule || prop.detectedRule || prop.automaticRule);
        const label = document.createElement("span");
        label.textContent = prop.name;
        if(prop.needsReview) label.title = "Cat\u00e9gorie \u00e0 confirmer";
        const select = document.createElement("select");
        select.dataset.categoryRule = prop.id;
        select.className = "native-select-hidden";
        const autoOpt = document.createElement("option");
        autoOpt.value = "auto";
        autoOpt.textContent = prop.needsReview ? "\u00c0 confirmer" : "Auto (" + (prop.automaticRule || "Ignorer") + ")";
        select.appendChild(autoOpt);
        avail.forEach(rule => {
          const opt = document.createElement("option");
          opt.value = rule;
          opt.textContent = rule;
          select.appendChild(opt);
        });
        select.value = prop.savedRule || "auto";
        nameDiv.append(swatch, label);
        row.append(nameDiv, select);
        elements.categorySettingsList.appendChild(row);
        createCustomDropdown(select);
      });
    }

    function parseFinancePage(page, index, categoryModel){
      const props = page.properties || {};
      const monthProp = findProperty(props, PROPERTY_NAMES.month);
      const yearProp = findProperty(props, PROPERTY_NAMES.year);
      const salaryProp = findProperty(props, PROPERTY_NAMES.salary);
      const bigExpProp = findProperty(props, PROPERTY_NAMES.bigExpenses);
      const monthLabel = getPropertyText(monthProp) || "Mois " + (index + 1);
      const yearLabel = getPropertyText(yearProp);
      const monthDate = getPropertyDate(monthProp) || parseFrenchMonth([monthLabel, yearLabel].filter(Boolean).join(" ")) || parseFrenchMonth(monthLabel);
      const propRules = getPropertyRules();
      let salaryTotal = 0;
      let hasIncome = false;
      let hasExpenses = false;
      let hasSavings = false;
      const ruleTotals = new Map();
      const ruleDetails = new Map();
      Object.entries(props).forEach(([pname, prop]) => {
        if(!isNumberLikeProperty(prop)) return;
        if(isMetaPropertyName(pname)) return;
        const val = getPropertyNumber(prop);
        const rkey = normalizePropertyName(pname);
        const saved = migrateRuleValue(propRules[rkey] || "auto");
        const auto = inferPropertyRule(pname, prop);
        const eff = saved === "auto" ? auto : saved;
        if(eff === "Salaire"){ salaryTotal += val; hasIncome = true; return; }
        if(!eff || eff === "Ignorer") return;
        if(eff === "D\u00e9pense") hasExpenses = true;
        if(eff === "\u00c9pargne") hasSavings = true;
        ruleTotals.set(eff, (ruleTotals.get(eff) || 0) + val);
        if(!ruleDetails.has(eff)) ruleDetails.set(eff, []);
        ruleDetails.get(eff).push({ name: pname, value: val });
      });
      const avail = (categoryModel?.availableRules || getAvailableRules()).filter(rule => rule !== "Ignorer" && rule !== "Salaire");
      const ruleBreakdown = avail
        .map(rule => ({ name: rule, color: getRuleColor(rule), value: ruleTotals.get(rule) || 0 }))
        .filter(item => item.value !== 0 || item.name === "D\u00e9pense" || item.name === "\u00c9pargne");
      const savingsTotal = ruleTotals.get("\u00c9pargne") || 0;
      const expensesTotal = ruleTotals.get("D\u00e9pense") || 0;
      return {
        id: page.id,
        label: formatMonthLabel(monthLabel, monthDate),
        originalLabel: monthLabel,
        date: monthDate,
        index,
        salary: salaryTotal || getPropertyNumber(salaryProp),
        hasIncome,
        hasExpenses,
        hasSavings,
        expenses: expensesTotal,
        ruleBreakdown,
        ruleDetails: Object.fromEntries(ruleDetails.entries()),
        bigExpenses: getPropertyText(bigExpProp) || "-",
        savingsTotal
      };
    }

    function normalizeFinanceDataset(pages){
      const cleanPages = (pages || []).filter(page => page && page.properties && Object.keys(page.properties).length > 0);
      const categoryModel = buildCategoryModel(cleanPages);
      const rawMonths = cleanPages
        .map((page, index) => parseFinancePage(page, index, categoryModel))
        .filter(month => month && (month.date || month.label));
      // Dédoublonne les mois : fusionne les pages qui résolvent vers le même mois (YYYY-MM).
      // Corrige les doublons apparus quand un fichier matrix contient plusieurs fois le même mois.
      const months = dedupMonths(rawMonths).sort(sortMonths);
      return { pages: cleanPages, categoryModel, months };
    }

    function canonicalMonthKey(month){
      if(month.date instanceof Date && !isNaN(month.date.getTime())){
        return month.date.getFullYear() + "-" + String(month.date.getMonth() + 1).padStart(2, "0");
      }
      return normalizePropertyName(month.label || month.originalLabel || "");
    }
    function mergeMonths(target, source){
      target.salary = (Number(target.salary) || 0) + (Number(source.salary) || 0);
      target.savingsTotal = (Number(target.savingsTotal) || 0) + (Number(source.savingsTotal) || 0);
      target.expenses = (Number(target.expenses) || 0) + (Number(source.expenses) || 0);
      const acc = new Map();
      [...(target.ruleBreakdown || []), ...(source.ruleBreakdown || [])].forEach(item => {
        if(!item || !item.name) return;
        if(!acc.has(item.name)) acc.set(item.name, Object.assign({}, item));
        else acc.get(item.name).value = (Number(acc.get(item.name).value) || 0) + (Number(item.value) || 0);
      });
      target.ruleBreakdown = Array.from(acc.values()).filter(i => i.value !== 0 || i.name === "D\u00e9pense" || i.name === "\u00c9pargne");
      const details = Object.assign({}, target.ruleDetails || {});
      Object.entries(source.ruleDetails || {}).forEach(([key, list]) => {
        details[key] = (details[key] || []).concat(list || []);
      });
      target.ruleDetails = details;
      return target;
    }
    function dedupMonths(months){
      const acc = new Map();
      const order = [];
      (months || []).forEach(month => {
        const key = canonicalMonthKey(month);
        if(!acc.has(key)){ acc.set(key, Object.assign({}, month)); order.push(key); }
        else mergeMonths(acc.get(key), month);
      });
      return order.map(key => acc.get(key));
    }

    function applyFinancePagesToState(pages, options = {}){
      const previousSelected = options.keepSelected ? state.selectedMonthId : "";
      const previousYear = options.keepSelected ? state.selectedYear : "";
      if(options.reset !== false) resetDataState();
      const normalized = normalizeFinanceDataset(pages);
      state.rawPages = normalized.pages;
      state.months = normalized.months;
      state.detectedProperties = normalized.categoryModel.detectedProperties;
      state.availableRules = normalized.categoryModel.availableRules || SYSTEM_RULES.slice();
      const years = Array.from(new Set(normalized.months.map(getMonthYear).filter(Boolean))).sort(sortYearValues);
      state.selectedYear = chooseDefaultYear(years, normalized.months, previousYear, previousSelected);
      const scopedMonths = normalized.months.filter(month => !state.selectedYear || getMonthYear(month) === state.selectedYear);
      state.selectedMonthId = scopedMonths.some(month => month.id === previousSelected)
        ? previousSelected
        : scopedMonths[scopedMonths.length - 1]?.id || normalized.months[normalized.months.length - 1]?.id || "";
      state.isGlobal = false;
      if(options.source) state.source = options.source;
      return normalized;
    }

    function calculateDashboardMetrics(months){
      const list = (months || []).filter(Boolean);
      // Une cellule absente ne représente pas un zéro : seuls les mois où un salaire
      // est réellement renseigné entrent dans la moyenne. Un zéro explicite
      // reste toutefois une valeur valide grâce au marqueur hasIncome.
      const salaryMonths = list.filter(month => month.hasIncome === true || (month.hasIncome == null && Number(month.salary) !== 0));
      const expenseMonths = list.filter(month => month.hasExpenses === true || (month.hasExpenses == null && Number(month.expenses) !== 0));
      const salaryValues = salaryMonths.map(month => Number(month.salary || 0));
      const savingsValues = list.map(month => Number(month.savingsTotal || 0));
      return {
        monthCount: list.length,
        incomeMonthCount: salaryMonths.length,
        avgSalary: salaryValues.length ? avg(salaryValues) : null,
        totalSalary: sum(list.map(month => Number(month.salary || 0))),
        totalSavings: sum(savingsValues),
        maxExpenseMonth: maxBy(expenseMonths, month => Math.abs(Number(month.expenses || 0))),
        minExpenseMonth: minBy(expenseMonths, month => Math.abs(Number(month.expenses || 0)))
      };
    }
    function getDashboardSharingSnapshot(){
      // Version dérivée destinée aux amis : elle ne contient ni cellules brutes
      // ni formules, uniquement les montants déjà affichés dans le dashboard.
      return { v:"dashboard-1", updatedAt:Date.now(), months:(state.months||[]).map(month=>({ label:month.label, year:getMonthYear(month), salary:Number(month.salary||0), expenses:Number(month.expenses||0), savingsTotal:Number(month.savingsTotal||0), hasIncome:month.hasIncome===true, hasExpenses:month.hasExpenses===true, hasSavings:month.hasSavings===true, ruleBreakdown:(month.ruleBreakdown||[]).map(item=>({name:item.name,value:Number(item.value||0)})) })) };
    }
    window.getDashboardSharingSnapshot = getDashboardSharingSnapshot;

    function updateSummaryCards(){
      const metrics = calculateDashboardMetrics(getVisibleMonths());
      if(!metrics.monthCount){
        elements.avgSalary.textContent = "-";
        elements.totalSavings.textContent = "-";
        elements.maxExpenseMonth.textContent = "-";
        elements.maxExpenseValue.textContent = "-";
        elements.minExpenseMonth.textContent = "-";
        elements.minExpenseValue.textContent = "-";
        elements.avgSalaryNote.textContent = "Tous les mois";
        elements.totalSavingsNote.textContent = "Comptes cumulés";
        var sgc = document.getElementById("savingsGoalCard"); if (sgc) sgc.hidden = true;
        updateMobileSummary();
        return;
      }
      elements.avgSalary.textContent = metrics.avgSalary === null ? "-" : formatEuro(metrics.avgSalary);
      elements.avgSalaryNote.textContent = metrics.incomeMonthCount ? metrics.incomeMonthCount + " mois avec salaire" : "Aucun salaire renseigné";
      elements.totalSavings.textContent = formatEuro(Math.abs(metrics.totalSavings));
      elements.totalSavingsNote.textContent = formatPercent(Math.abs(metrics.totalSavings), metrics.totalSalary) + " du salaire total";
      elements.maxExpenseMonth.textContent = metrics.maxExpenseMonth?.label || "-";
      elements.maxExpenseValue.textContent = metrics.maxExpenseMonth ? formatEuro(Math.abs(metrics.maxExpenseMonth.expenses)) : "-";
      elements.minExpenseMonth.textContent = metrics.minExpenseMonth?.label || "-";
      elements.minExpenseValue.textContent = metrics.minExpenseMonth ? formatEuro(Math.abs(metrics.minExpenseMonth.expenses)) : "-";
      // La barre de progression de l'objectif d'épargne reflète UNIQUEMENT le mois sélectionné
      const selectedMonth = getSelectedMonth();
      const selectedSavings = selectedMonth ? Math.abs(Number(selectedMonth.savingsTotal || 0)) : 0;
      updateSavingsGoalCard(selectedSavings);
      updateMobileSummary();
    }

    // Pont tableur -> dashboard : construit directement des "pages" a partir
    // des lignes/colonnes du tableur (ligne 0 = en-tetes, lignes suivantes = donnees),
    // puis reutilise le moteur de months/categories existant (applyFinancePagesToState).
    function wrapSheetValue(val){
      if(val instanceof Date) return { type: "date", date: { start: val.toISOString() } };
      if(typeof val === "number" && isFinite(val)) return { type: "number", number: val };
      return { type: "rich_text", rich_text: [{ type: "text", text: String(val), plain_text: String(val) }] };
    }
    function syncDashboardFromFinanceSheet(opts){
      opts = opts || {};
      var silent = opts.silent === true;
      var btn = document.getElementById("syncSheetButton");
      try{
        if(typeof window.FinanceSheet === "undefined" || typeof window.FinanceSheet.buildWorkbook !== "function"){
          if(!silent) showMessage("Le tableur n'est pas encore chargé. Ouvre l'onglet Tableur d'abord.");
          return false;
        }
        // Guard: si le tableur est vide, vide aussi le dashboard
        var snap = window.FinanceSheet.getSnapshot ? window.FinanceSheet.getSnapshot() : null;
        var hasData = snap && snap.sheets && snap.sheets.some(function(sh){ return sh.cells && Object.keys(sh.cells).length > 0; });
        if(!hasData){
          resetDataState(); updateInterface();

          return false;
        }
        if(typeof window.XLSX === "undefined" || !window.XLSX?.utils?.sheet_to_json){
          if(!silent) showMessage("La bibliothèque Excel n'est pas chargée. Vérifie ta connexion internet.");
          return false;
        }
        const wb = window.FinanceSheet.buildWorkbook();
        if(!wb || !wb.SheetNames || !wb.SheetNames.length){ applyFinancePagesToState([], { source: "tableur", reset: true }); populateMonthSelect(); updateInterface(); if(!silent) showMessage("Le tableur est vide. Saisis des données dans l'onglet Tableur puis clique sur Recharger."); return false; }
        const pages = [];
        wb.SheetNames.forEach((sheetName) => {
          const ws = wb.Sheets[sheetName];
          if(!ws || !ws["!ref"]) return;
          const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, blankrows: false });
          if(!aoa || aoa.length < 2) return;
          const headers = aoa[0] || [];
          // Détection des en-têtes qui sont des mois (layout "mois en colonnes")
          const monthCols = [];
          for(let c = 0; c < headers.length; c++){ if(parseFrenchMonth(headers[c])) monthCols.push(c); }
          const isMatrix = monthCols.length >= 2 && !parseFrenchMonth(headers[0]);
          if(isMatrix){
            // Chaque colonne-mois devient une page ; les lignes sont les catégories.
            const labelCol = 0;
            monthCols.forEach(c => {
              const props = {};
              let nonEmpty = 0;
              for(let r = 1; r < aoa.length; r++){
                const row = aoa[r]; if(!row) continue;
                const label = row[labelCol];
                const val = row[c];
                if(label === undefined || label === null || label === "") continue;
                if(val === undefined || val === null || val === "") continue;
                props[String(label)] = wrapSheetValue(val); nonEmpty++;
              }
              if(nonEmpty){
                // Extraire l'année du nom de feuille (ex: "2025", "2025 - Table 1", "2026 - Budget")
                var yearExtracted = (function(){
                  var m = String(sheetName).match(/(19\d{2}|20\d{2}|21\d{2})/);
                  return m ? m[1] : null;
                })();
                // Construire une date Mois complète si on a l'année
                if(yearExtracted){
                  var monthDate = parseFrenchMonth(headers[c] + " " + yearExtracted);
                  if(monthDate){
                    props["Mois"] = { type: "date", date: { start: formatDateIsoLocal(monthDate) } };
                  } else {
                    props["Mois"] = wrapSheetValue(headers[c]);
                  }
                  props["Année"] = wrapSheetValue(yearExtracted);
                } else {
                  props["Mois"] = wrapSheetValue(headers[c]);
                }
                pages.push({ id: sheetName + "_m" + c, properties: props });
              }
            });
            return;
          }
          // === Layout transactionnel : détection automatique ===
          // Chaque ligne est une transaction avec une description et un montant.
          // On groupe par description et on somme les montants.
          var isDefaultHeaders = headers.every(function(h){ return !h || /^[A-Z]{1,3}$/.test(String(h)); });
          var hasMonthHeader = headers.some(function(h){ return h && /mois/i.test(String(h)); });
          if(!isMatrix && (isDefaultHeaders || !hasMonthHeader)){
            // Analyser les colonnes pour trouver la description (texte) et le montant (numérique)
            var textCol = -1, numCol = -1, dateCol = -1;
            var textScore = 0, numScore = 0, dateScore = 0;
            for(var c = 0; c < headers.length; c++){
              var texts = 0, nums = 0, dates = 0;
              for(var r = 1; r < aoa.length; r++){
                var rv = aoa[r] && aoa[r][c];
                if(rv === undefined || rv === null || rv === "") continue;
                var rvStr = String(rv).trim();
                // Nombre ?
                if(typeof rv === "number" || /^-?[\d\s.,]+€?$/.test(rvStr)){ nums++; }
                // Date ?
                else if(/^(0?[1-9]|[12][0-9]|3[01])[\/\-.](0?[1-9]|1[0-2])[\/\-.]\d{2,4}$/.test(rvStr) || rv instanceof Date){ dates++; }
                // Texte (description)
                else if(rvStr.length >= 2 && !/^[A-Z]{1,3}$/.test(rvStr)){ texts++; }
              }
              if(dates > dateScore){ dateCol = c; dateScore = dates; }
              if(nums > numScore){ numCol = c; numScore = nums; }
              if(texts > textScore){ textCol = c; textScore = texts; }
            }
            // Transaction-style : au moins 2 lignes avec description + montant
            if(textCol >= 0 && numCol >= 0 && textCol !== numCol && textScore >= 2 && numScore >= 2){
              // Grouper par description, sommer les montants
              var grouped = {};
              var monthFromTransactions = null;
              for(var r = 1; r < aoa.length; r++){
                var tRow = aoa[r]; if(!tRow) continue;
                var desc = tRow[textCol];
                var amt = tRow[numCol];
                if(desc === undefined || desc === null || desc === "") continue;
                var descStr = String(desc).trim();
                if(amt === undefined || amt === null || amt === "") continue;
                var amtNum = typeof amt === "number" ? amt : parseFloat(String(amt).replace(/[^\d.,-]/g, "").replace(",", ".")) || 0;
                if(!grouped[descStr]) grouped[descStr] = 0;
                grouped[descStr] += amtNum;
                // Détecter le mois depuis la colonne date
                if(dateCol >= 0 && !monthFromTransactions){
                  var dv = tRow[dateCol];
                  if(dv){ monthFromTransactions = parseFrenchMonth(String(dv)) || monthFromTransactions; }
                }
              }
              var tProps = {};
              var tNonEmpty = 0;
              var tKeys = Object.keys(grouped);
              tKeys.forEach(function(k){
                // Classification automatique basée sur le signe et les mots-clés
                var totalAmt = grouped[k];
                var autoRule = classifyFinancialProperty(k);
                if(!autoRule || autoRule === "Ignorer"){
                  // Si pas reconnu par mots-clés, utiliser le signe du montant
                  autoRule = totalAmt < 0 ? "Dépense" : "Salaire";
                }
                tProps[k] = { type: "number", number: totalAmt, _autoRule: autoRule, _autoConfidence: 0.6 };
                tNonEmpty++;
              });
              if(monthFromTransactions){ tProps["Mois"] = wrapSheetValue(monthFromTransactions); }
              else if(dateCol >= 0){
                // Utiliser la première date comme mois
                var firstDate = aoa[1] && aoa[1][dateCol];
                if(firstDate){
                  var fm = parseFrenchMonth(String(firstDate));
                  if(fm) tProps["Mois"] = wrapSheetValue(fm);
                }
              }
              if(tNonEmpty){
                var yearMatchTx = String(sheetName).match(/(19\d{2}|20\d{2}|21\d{2})/);
                if(yearMatchTx) tProps["Année"] = wrapSheetValue(yearMatchTx[1]);
                pages.push({ id: sheetName + "_transactions", properties: tProps });
              }
              return; // Passer à la feuille suivante
            }
          }
          // Layout synthèse : les lignes sont des mois. On détecte la colonne "Mois".
          let moisCol = headers.findIndex(h => h && /mois/i.test(String(h)));
          if(moisCol < 0){
            for(let c = 0; c < headers.length; c++){
              let checked = 0, months = 0;
              for(let r = 1; r < Math.min(aoa.length, 6); r++){
                const v = aoa[r]?.[c];
                if(v === undefined || v === null || v === "") continue;
                checked++; if(parseFrenchMonth(v)) months++;
              }
              if(checked >= 2 && months === checked){ moisCol = c; break; }
            }
          }
          for(let r = 1; r < aoa.length; r++){
            const row = aoa[r]; if(!row) continue;
            const props = {};
            let nonEmpty = 0, moisVal = null;
            for(let c = 0; c < headers.length; c++){
              const key = headers[c]; if(!key) continue;
              const val = row[c];
              if(val === undefined || val === null || val === "") continue;
              if(c === moisCol){ moisVal = val; continue; }
              props[String(key)] = wrapSheetValue(val); nonEmpty++;
            }
            if(moisCol >= 0 && moisVal !== null && moisVal !== undefined){ 
              // Extraire l'année du nom de feuille pour créer une date complète
              var yearExtractedSyn = (function(){
                var m = String(sheetName).match(/(19\d{2}|20\d{2}|21\d{2})/);
                return m ? m[1] : null;
              })();
              if(yearExtractedSyn){
                var md = parseFrenchMonth(String(moisVal) + " " + yearExtractedSyn);
                if(md){ props["Mois"] = { type: "date", date: { start: formatDateIsoLocal(md) } }; }
                else { props["Mois"] = wrapSheetValue(moisVal); }
                props["Année"] = wrapSheetValue(yearExtractedSyn);
              } else {
                props["Mois"] = wrapSheetValue(moisVal); 
              }
              nonEmpty++; 
            }
            // Si le nom de la feuille contient une année, l'ajouter comme propriété Année
            var yearMatchSyn = String(sheetName).match(/(19\d{2}|20\d{2}|21\d{2})/);
            if(yearMatchSyn && !props["Année"]){ props["Année"] = wrapSheetValue(yearMatchSyn[1]); nonEmpty++; }
            if(nonEmpty) pages.push({ id: sheetName + "_" + r, properties: props });
          }
        });
        applyFinancePagesToState(pages, { source: "tableur", reset: true });
        populateMonthSelect();
        updateInterface();
        if(pages.length) setConnection(true, "Tableur");

        if(!silent){
          var catCount = (state.detectedProperties||[]).length;
          var monthCount = (state.months||[]).length;
          if(monthCount === 0){
            showMessage("Le tableur ne contient pas encore de données. Saisis tes données dans l'onglet Tableur puis clique sur Recharger.", 8000);
          } else {
            showMessage("Données rechargées : " + monthCount + " mois, " + catCount + " catégories détectées.", 5000);
          }
        }
        return true;
      }catch(err){ console.error("syncDashboardFromFinanceSheet:", err); if(!silent) showMessage("Erreur lors du rechargement : " + (err.message||err), 10000); return false; } finally { try{ if(typeof window.updateSheetStatus === "function") window.updateSheetStatus(); }catch(e){} }
    }
    window.syncDashboardFromFinanceSheet = syncDashboardFromFinanceSheet;
    window.populateYearSelect = populateYearSelect;

    function updateSheetStatus(){

    async function importFinanceFile(file){
      if(!file) return;
      const extension = (file.name.split(".").pop() || "").toLowerCase();
      const textLike = ["csv", "tsv", "txt", "json", "xml", "html", "htm"].includes(extension);
      const spreadsheetLike = ["xlsx", "xls", "xlsm", "ods"].includes(extension);
      if(!spreadsheetLike && !textLike){
        showMessage("Format non pris en charge. Utilise un fichier Excel, CSV, JSON, XML ou HTML contenant un tableau.");
        return;
      }
      setLoading(true);
      try{
        let tables = [], workbook = null, decodeIssues = [], encoding = "";
        if(spreadsheetLike){
          if(typeof window.XLSX === "undefined" || !window.XLSX?.read || !window.XLSX?.utils?.sheet_to_json){
            showMessage("Le module Excel n'a pas pu être chargé. Vérifie la connexion internet.");
            return;
          }
          const buffer = await readFileArrayBuffer(file);
          try{
            workbook = XLSX.read(buffer, { type: "array", cellDates: true, raw: true, WTF: false });
          }catch(err){
            throw new Error("Structure Excel invalide ou fichier corrompu : " + (err?.message || err));
          }
          tables = tableFromXlsxWorkbook(workbook);
        }else{
          const buffer = await readFileArrayBuffer(file);
          const decoded = decodeTextBuffer(buffer, file.name);
          decodeIssues = decoded.issues || [];
          encoding = decoded.encoding || "";
          file._text = decoded.text;
          file._analysisIssues = decodeIssues;
          file._textEncoding = encoding;
          tables = tableFromTextFile(file.name, decoded.text, decodeIssues);
        }
        if(!tables.length) throw new Error("Aucune structure tabulaire exploitable n'a été détectée dans ce fichier.");
        const analysisBundle = analyzeWorkbookSheets(tables, { fileName: file.name, sheetName: tables[0]?.name || "Feuille 1", issues: decodeIssues });
        const analysis = analysisBundle.chosen;
        if(!analysis) throw new Error("Impossible d'analyser ce fichier.");
        if(!analysis.dataRows?.length) throw new Error("Le fichier ne contient pas assez de lignes exploitables.");
        const workbookPages = buildPagesFromWorkbookBundle(analysisBundle, file.name);
        const pages = workbookPages.pages;
        if(!pages.length) throw new Error("Aucune ligne exploitable trouvée dans le fichier.");
        const normalized = applyFinancePagesToState(pages, { source: "file", reset: true });
        const months = normalized.months;
        const reviewCount = (normalized.categoryModel.detectedProperties || []).filter(prop => prop.needsReview).length;
        const reviewCategories = (normalized.categoryModel.detectedProperties || []).filter(prop => prop.needsReview).map(prop => prop.name);
        const issues = workbookPages.issues || [];
        const warningCount = issues.filter(issue => issue.severity !== "info").length;
        const importedSheets = workbookPages.importedSheets.length ? workbookPages.importedSheets : [analysis.sheetName || tables[0]?.name || "Feuille 1"];
        state.importedFile = { fileName: file.name, sheetName: importedSheets.join(", "), importedSheets, sheetCount: importedSheets.length, rows: pages.length, monthCount: months.length, processedRows: workbookPages.processedRows, cols: workbookPages.maxCols || analysis.cols || 0, fileType: extension, sourceKind: analysis.sourceKind || "table", score: analysis.score || 0, issuesCount: warningCount, reviewCount, reviewCategories, issues, encoding, importMode: workbookPages.importMode };
        state.importAnalysis = { fileName: file.name, fileType: extension, sourceKind: analysis.sourceKind || "table", sheetName: importedSheets.join(", "), importedSheets, sheetCount: importedSheets.length, rows: workbookPages.processedRows || analysis.rows || 0, monthCount: months.length, cols: workbookPages.maxCols || analysis.cols || 0, score: analysis.score || 0, columns: analysis.columns || [], sheetSummaries: analysisBundle.sheetSummaries || [], issues, encoding, importMode: workbookPages.importMode, reviewCount };
        logImportIssues(file.name, issues);
        renderImportBadge(state.importedFile);
        renderImportAnalysis(state.importAnalysis);
        populateMonthSelect();
        setConnection(true, "Fichier importé");
        updateInterface();
        setTimeout(function(){ if(typeof window.populateYearSelect === "function") window.populateYearSelect(); }, 500);
        emitSiteEvent("import", "Import fichier réussi", { fileName: file.name, sheets: importedSheets.length, rows: pages.length, months: months.length });
        if(months.length === 0) showMessage("Le fichier a été analysé, mais aucun champ financier clair n'a été détecté.");
        else if(reviewCount) showMessage("Import réussi : " + file.name + ". " + reviewCount + " categorie" + (reviewCount > 1 ? "s" : "") + " à confirmer dans les réglages.", 22000);
        else if(warningCount) showMessage("Import réussi : " + file.name + " (" + warningCount + " anomalie" + (warningCount > 1 ? "s" : "") + " consignée" + (warningCount > 1 ? "s" : "") + ").", 20000);
        else showMessage("Import réussi : " + file.name);
      }catch(err){
        console.error(err);
        renderImportAnalysis(null);
        emitSiteEvent("error", "Import fichier échoué", { reason: err?.message || "Erreur inconnue" });
        showMessage(err?.message || "Impossible d'importer ce fichier.");
      }finally{
        setLoading(false);
      }
    }

    function runFileAnalysisSelfTest(){
      const fixtures = [
        {
          name: "ledger-edge-cases.csv",
          text: " Date ; Libelle ; Montant \n05/06/2024 ; Cafe & The ; -12,50\n\n31-07-2024 ; Salaire ; 2 500,00\nligne corrompue ; ??? ; abc\n15 aout 2024 ; Epargne Livret ; 100,00",
          minPages: 3,
          expectsIssues: true
        },
        {
          name: "summary-duplicates.csv",
          text: "Mois;Salaire;Depense;Depense\n2024-01-01;2500;100;50\nFevrier 2024;2600;120;60",
          minPages: 2,
          expectedMode: "summary",
          expectsIssues: true
        },
        {
          name: "matrix-budget-2026.csv",
          text: ";Cat\u00e9gorie / Poste;Janvier;F\u00e9vrier;Mars;TOTAL\n;\ud83d\udcb0 Revenus;;;;\n;  Salaire;1538;1519;1519;4576\n;Sous-total Revenus;1538;1519;1519;4576\n;\ud83d\udcb8 D\u00e9penses;;;;\n;  D\u00e9penses;300;300;300;900\n;  Loyer;0;0;0;0\n;Sous-total D\u00e9penses;300;300;300;900\n;\ud83c\udfe6 \u00c9pargne;;;;\n;  Livret A;1000;1000;1000;3000\n;  \u00c9pargne (Revolut);0;10;5;15\n;Sous-total \u00c9pargne;1000;1010;1005;3015",
          minPages: 3,
          expectedMode: "matrix",
          expectsIssues: false
        }
      ];
      const results = fixtures.map(fixture => {
        const tables = tableFromTextFile(fixture.name, fixture.text, []);
        const bundle = analyzeWorkbookSheets(tables, { fileName: fixture.name, sheetName: tables[0]?.name || "CSV" });
        const analysis = bundle.chosen;
        const pages = buildPagesFromAnalysis(analysis, fixture.name, analysis?.sheetName || "CSV");
        const ok = pages.length >= fixture.minPages
          && (!fixture.expectedMode || analysis.importMode === fixture.expectedMode)
          && (!fixture.expectsIssues || (analysis.issues || []).length > 0);
        return { name: fixture.name, ok, pages: pages.length, issues: (analysis.issues || []).length, mode: analysis.importMode };
      });
      return { ok: results.every(result => result.ok), results };
    }
    window.__fileAnalysisSelfTest = runFileAnalysisSelfTest;

      setTimeout(function(){ try{ populateYearSelect(); }catch(e){} }, 600);
      setTimeout(showLatestUpdate,1800);

<script>(function(){
  /* === Auth email + mot de passe (Supabase) ===
     Pas de serveur à gérer : le SDK charge la config depuis supabase_config.json.
     La clé anon est publique par conception (protégée par les RLS Supabase). */
  var sb = { config: null, client: null, user: null };
  function el(id){ return document.getElementById(id); }
  function translateAuthError(error){
    var raw = String((error && error.message) || error || "").trim();
    var normalized = raw.toLowerCase();
    if(/database error saving new user|error saving new user/.test(normalized)) return "La création du compte a échoué côté base de données. Le correctif Supabase doit être appliqué par l’administrateur du projet.";
    if(/invalid login credentials|invalid credentials/.test(normalized)) return "Email ou mot de passe incorrect.";
    if(/email not confirmed|email.*not.*confirm/.test(normalized)) return "Ton adresse email n’est pas encore confirmée.";
    if(/user already registered|already.*registered/.test(normalized)) return "Un compte existe déjà avec cette adresse email.";
    if(/password should be at least|password.*least/.test(normalized)) return "Le mot de passe doit contenir au moins 8 caractères.";
    if(/rate limit|too many requests/.test(normalized)) return "Trop de tentatives. Réessaie dans quelques instants.";
    if(/network|fetch/.test(normalized)) return "Impossible de contacter le service de connexion. Vérifie ta connexion internet.";
    return raw || "Une erreur est survenue. Réessaie.";
  }

  async function loadConfig(){
    // La clé publishable est nécessaire côté navigateur, mais doit rester
    // distincte du code pour pouvoir changer de projet Supabase sans modifier l'app.
    try{
      var r = await fetch("supabase_config.json", { cache: "no-store" });
      if(!r.ok) return null;
      var c = await r.json();
      if(!c || !c.url || !c.anonKey) return null;
      return c;
    }catch(e){ return null; }
  }

  // Stockage robuste : si localStorage est bloque (iframe sandbox / origin opaque),
  // on bascule sur un stockage en memoire pour que l'auth reste fonctionnelle.
  function safeStorage(){
    try{
      var ls = window.localStorage;
      ls.setItem("__sb_t","1"); ls.removeItem("__sb_t");
      return ls;
    }catch(e){
      var mem = {};
      return {
        getItem: function(k){ return (k in mem) ? mem[k] : null; },
        setItem: function(k,v){ mem[k] = String(v); },
        removeItem: function(k){ delete mem[k]; }
      };
    }
  }

  // Filet de securite : si un ancien trigger n'a pas cree le profil au moment
  // de l'inscription, le premier login le cree avec les droits de son owner.
  async function ensureProfile(user){
    if(!sb.client || !user || !user.id) return;
    try{
      var result = await sb.client.from("profiles").upsert(
        { id: user.id, email: user.email || null },
        { onConflict: "id", ignoreDuplicates: true }
      );
      if(result && result.error) console.warn("Profile repair skipped:", result.error.message || result.error);
    }catch(e){ console.warn("Profile repair skipped:", e); }
  }

  function initClient(config){
    try{
      // Construit l'URL de redirection pour les emails de confirmation
      var redirectUrl = window.location.origin + window.location.pathname;
      sb.client = window.supabase.createClient(config.url, config.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: safeStorage() }
      });
      // Arrivee depuis le lien de confirmation email : on affiche un message clair.
      var arrivedFromEmail = /([?&]code=|#access_token=)/.test(location.href);
      sb.client.auth.onAuthStateChange(function(evt, session){
        sb.user = (session && session.user) ? session.user : null;
        if(sb.user) ensureProfile(sb.user);
        renderAuth();
        // Notifie les autres modules (amis, sync) du changement d'état
        window.dispatchEvent(new CustomEvent("authStateChanged", { detail: { user: sb.user, event: evt } }));
        if(evt === "SIGNED_IN" && arrivedFromEmail){ msg("Email confirmé — vous êtes connecté.", "ok"); }
        if(evt === "SIGNED_IN" && !arrivedFromEmail && sb.lastWasSignup){ msg("Connexion réussie.", "ok"); }
        if(evt === "SIGNED_OUT"){ sb.user = null; renderAuth(); msg("Déconnecté."); }
        if(evt === "PASSWORD_RECOVERY"){ msg("Réinitialisation du mot de passe — choisissez un nouveau mot de passe."); }
        arrivedFromEmail = false;
      });
      // Restaure la session existante au chargement
      sb.client.auth.getSession().then(function(res){
        if(res && res.data && res.data.session && res.data.session.user){
          sb.user = res.data.session.user;
          ensureProfile(sb.user);
        }
        renderAuth();
      }).catch(function(e){
        console.warn("Session restore failed:", e);
        renderAuth();
      });
      // Si l'URL contient un code de confirmation, on informe l'utilisateur.
      if(arrivedFromEmail){ msg("Validation de votre email en cours…"); }
    }catch(e){
      console.error("Supabase init error", e);
      if(el("accountStatus")) el("accountStatus").textContent = "Erreur de connexion";
      if(el("accountHint")){ el("accountHint").style.display = ""; el("accountHint").innerHTML = "Impossible de se connecter au service d'authentification. Vérifiez votre connexion internet et réessayez."; }
      renderAuth();
    }
  }

  function renderAuth(){
    var form = el("accountForm"); var userInfo = el("accountUserInfo");
    var section=document.querySelector(".account-section"),syncDetail=el("accountSyncDetail");
    if(section)section.classList.toggle("is-connected",!!sb.user);
    if(syncDetail)syncDetail.hidden=!sb.user;
    var hint = el("accountHint"); var status = el("accountStatus"); var logoutButtons = Array.from(document.querySelectorAll("[data-account-logout]")); var intro = el("accountIntro"); var deleteButton = el("settingsDeleteBtn");
    var profileAvatar = el("profileAvatar"); var profileLabel = el("profileLabel"); var profileEmail = el("profileEmail");
    if(!sb.client){
      if(form) form.style.display = "none";
      if(userInfo) userInfo.style.display = "none";
      logoutButtons.forEach(function(button){ button.hidden = true; button.style.display = "none"; });
      if(deleteButton){ deleteButton.hidden = true; deleteButton.style.display = "none"; }
      if(intro) intro.style.display = "";
      if(profileAvatar) profileAvatar.textContent = "?";
      if(profileLabel) profileLabel.textContent = "Profil";
      if(profileEmail) profileEmail.textContent = "Non connecté";
      if(hint){ hint.style.display = ""; hint.innerHTML = "Pour activer la connexion par email, crée un projet Supabase gratuit puis renseigne son URL et sa clé publique (anon key) dans le fichier <code>supabase_config.json</code>."; }
      if(status) status.textContent = "Non configuré";
      return;
    }
    if(sb.user){
      if(form) form.style.display = "none";
      if(userInfo) userInfo.style.display = "";
      logoutButtons.forEach(function(button){ button.hidden = false; button.style.display = "inline-flex"; });
      if(deleteButton){ deleteButton.hidden = false; deleteButton.style.display = "inline-flex"; }
      if(intro) intro.style.display = "none";
      var d = el("accountEmailDisplay"); if(d) d.textContent = sb.user.email || "";
      var av = el("accountUserAvatar"); if(av) av.textContent = (sb.user.email || "?").charAt(0).toUpperCase();
      if(profileAvatar) profileAvatar.textContent = (sb.user.email || "?").charAt(0).toUpperCase();
      if(profileLabel) profileLabel.textContent = "Profil";
      if(profileEmail) profileEmail.textContent = sb.user.email || "Connecté";
      if(status) status.textContent = "Connecté";
      if(hint) hint.style.display = "none";
    }else{
      if(form) form.style.display = "";
      if(userInfo) userInfo.style.display = "none";
      logoutButtons.forEach(function(button){ button.hidden = true; button.style.display = "none"; });
      if(deleteButton){ deleteButton.hidden = true; deleteButton.style.display = "none"; }
      if(intro) intro.style.display = "";
      if(profileAvatar) profileAvatar.textContent = "?";
      if(profileLabel) profileLabel.textContent = "Profil";
      if(profileEmail) profileEmail.textContent = "Non connecté";
      if(status) status.textContent = "Déconnecté";
      if(hint) hint.style.display = "none";
    }
  }

  function msg(t, kind){ var m = el("accountMsg"); if(m){ m.textContent = t; m.className = "account-msg " + (kind||""); } }
  function clearMsg(){ msg(""); }
  function setLoading(v){ ["accountLoginBtn","accountRegisterBtn","accountResendBtn","accountConfirmCheckBtn","accountChangeEmailBtn"].forEach(function(id){var button=el(id);if(button)button.disabled=v;}); }
  function accountPane(name){var loginPane=el("accountLoginPane"),registerPane=el("accountRegisterPane"),confirmPane=el("accountEmailConfirmStep"),loginTab=el("accountLoginTab"),registerTab=el("accountRegisterTab");if(loginPane)loginPane.hidden=name!=="login";if(registerPane)registerPane.hidden=name!=="register";if(confirmPane)confirmPane.hidden=name!=="confirm";if(loginTab){loginTab.classList.toggle("is-active",name==="login");loginTab.setAttribute("aria-selected",String(name==="login"));}if(registerTab){registerTab.classList.toggle("is-active",name==="register"||name==="confirm");registerTab.setAttribute("aria-selected",String(name==="register"||name==="confirm"));}}
  function accountEmail(kind){var id=kind==="register"?"accountRegisterEmail":"accountLoginEmail";return String(el(id)&&el(id).value||"").trim();}
  function showEmailConfirmation(email){sb.pendingSignupEmail=email;accountPane("confirm");var description=el("accountConfirmDescription");if(description)description.textContent="Nous avons envoyé un lien sécurisé à "+email+".";}

  async function register(){
    var email = accountEmail("register");
    var pw = el("accountRegisterPw").value||"";
    if(!email || !pw){ msg("Renseigne un email et un mot de passe."); return; }
    if(pw.length < 8){ msg("Le mot de passe doit faire au moins 8 caractères."); return; }
    setLoading(true); clearMsg();
    try{
      var res = await sb.client.auth.signUp({
        email: email,
        password: pw,
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      });
      if(res.error){ msg(translateAuthError(res.error)); return; }
      sb.lastWasSignup = true;
      if(res.data.session){ msg("Compte créé — vous êtes connecté.", "ok"); }
      else {
        showEmailConfirmation(email);
        msg("Lien de confirmation envoyé. Vérifie ta boîte de réception.", "ok");
      }
    }catch(e){
      console.error("Register error:", e);
      msg(translateAuthError(e));
    }
    finally{ setLoading(false); }
  }

  async function resend(){
    var email = sb.pendingSignupEmail || accountEmail("register");
    if(!email){ msg("Renseigne d’abord ton adresse email."); return; }
    setLoading(true); clearMsg();
    try{
      var res = await sb.client.auth.resend({ email: email, type: "signup" });
      if(res.error){ msg(translateAuthError(res.error)); return; }
      msg("Nouveau lien envoyé. Vérifie aussi tes spams.", "ok");
    }catch(e){ msg(e.message||"Erreur lors du renvoi."); }
    finally{ setLoading(false); }
  }

  async function login(){
    var email = accountEmail("login");
    var pw = el("accountLoginPw").value||"";
    if(!email || !pw){ msg("Renseigne un email et un mot de passe."); return; }
    setLoading(true); clearMsg();
    try{
      var res = await sb.client.auth.signInWithPassword({ email: email, password: pw });
      if(res.error){
        var unconfirmed = /not confirmed|non confirm/i.test(res.error.message || "");
        msg(translateAuthError(res.error));
        if(unconfirmed){ showEmailConfirmation(email); msg("Ton adresse n’est pas encore confirmée. Ouvre le lien reçu par e-mail."); }
        return;
      }
    }catch(e){ msg(translateAuthError(e)); }
    finally{ setLoading(false); }
  }

  async function checkEmailConfirmation(){
    setLoading(true); clearMsg();
    try{var res=await sb.client.auth.getSession();if(res&&res.data&&res.data.session){sb.pendingSignupEmail="";msg("Adresse confirmée — vous êtes connecté.","ok");}else{msg("Le lien n’a pas encore été validé. Ouvre l’e-mail reçu puis clique sur le lien de confirmation.");}}
    catch(e){msg(translateAuthError(e));}
    finally{setLoading(false);}
  }

  async function logout(){ try{ await sb.client.auth.signOut(); sb.lastWasSignup = false; sb.pendingSignupEmail=""; }catch(e){} }

  function wire(){
    var a = el("accountLoginBtn"); if(a) a.addEventListener("click", function(e){ e.preventDefault(); login(); });
    var b = el("accountRegisterBtn"); if(b) b.addEventListener("click", function(e){ e.preventDefault(); register(); });
    var rd = el("accountResendBtn"); if(rd) rd.addEventListener("click", function(e){ e.preventDefault(); resend(); });
    var loginTab=el("accountLoginTab"),registerTab=el("accountRegisterTab");if(loginTab)loginTab.addEventListener("click",function(){clearMsg();accountPane("login");});if(registerTab)registerTab.addEventListener("click",function(){clearMsg();accountPane("register");});
    var confirmCheck=el("accountConfirmCheckBtn");if(confirmCheck)confirmCheck.addEventListener("click",function(e){e.preventDefault();checkEmailConfirmation();});
    var changeEmail=el("accountChangeEmailBtn");if(changeEmail)changeEmail.addEventListener("click",function(){clearMsg();accountPane("register");});
    document.querySelectorAll("[data-account-logout]").forEach(function(button){ button.addEventListener("click", function(e){ e.preventDefault(); logout(); }); });
    var f = el("accountForm"); if(f) f.addEventListener("submit", function(e){ e.preventDefault(); if(!el("accountLoginPane").hidden)login(); });
    var fp = el("accountForgotBtn"); if(fp) fp.addEventListener("click", function(e){ e.preventDefault(); resetPassword(); });
  }

  async function resetPassword(){
    var email = accountEmail("login") || accountEmail("register");
    if(!email){ msg("Renseigne d'abord ton email."); return; }
    setLoading(true); clearMsg();
    try{
      var res = await sb.client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      if(res.error){ msg(translateAuthError(res.error)); return; }
      msg("Email de réinitialisation envoyé. Vérifie ta boîte de réception (et les spams).", "ok");
    }catch(e){ msg(translateAuthError(e)); }
    finally{ setLoading(false); }
  }

  async function start(){ wire(); sb.config = await loadConfig(); if(sb.config){ initClient(sb.config); } else { renderAuth(); } }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
  window.__account = sb;
})();
</script>
<script>(function(){
  /* === Sync Supabase (offline-first, multi-device) ===
     Sauvegarde locale immediate + sync cloud des qu'on est en ligne.
     Utilise une table finance_snapshots pour stocker le snapshot complet
     (toutes les feuilles, formules, headers, etc.).
     Hors ligne : sauvegarde locale, sync au retour du reseau. */
  var syncState = { dirty: false, lastSync: 0, pulling: false, pushing: false, suppressPush: false, userId: "", remoteUpdatedAt: "", scheduledPull: null };

  function getSupabase(){ try{ return window.__account && window.__account.client ? window.__account.client : null; }catch(e){ return null; } }
  function getUser(){ try{ return window.__account && window.__account.user ? window.__account.user : null; }catch(e){ return null; } }
  function getFinanceSheet(){ try{ return window.FinanceSheet || null; }catch(e){ return null; } }

  // === PUSH : pousse le snapshot complet vers Supabase ===
  async function pushToCloud(){
    var sb = getSupabase();
    var user = getUser();
    var fs = getFinanceSheet();
    if(!sb || !user || !fs){ return false; }
    if(syncState.pushing || syncState.suppressPush) return false;
    syncState.pushing = true;
    updateSyncStatus();
    try{
      var snap = fs.getSnapshot ? fs.getSnapshot() : null;
      if(!snap || !snap.sheets || !snap.sheets.length){ syncState.pushing = false; return false; }
      
      // Le profil contient uniquement les préférences personnelles, les
      // objectifs et le bloc-notes du propriétaire. Il ne fait jamais partie
      // des snapshots destinés aux amis.
      var privateProfile = null;
      try { privateProfile = JSON.parse(safeStore.getItem("personalFinanceDashboard.setupProfile") || "null"); } catch(e) {}
      var cloudUpdatedAt = new Date().toISOString();
      var payload = JSON.stringify({ v: snap.v || "cloud", sheets: snap.sheets, activeSheetId: snap.activeSheetId, profile: privateProfile && typeof privateProfile === "object" ? privateProfile : null, savedAt: Date.now() });
      
      var res = await sb.from("finance_snapshots").upsert({
        owner_id: user.id,
        payload: payload,
        updated_at: cloudUpdatedAt
      }, { onConflict: "owner_id" });
      
      if(res.error){ console.warn("Sync push error:", res.error.message); syncState.pushing = false; return false; }
      // Le dashboard est stocké séparément du tableur complet : autoriser le
      // dashboard ne donne donc jamais accès aux cellules ni aux formules.
      var dashboardPayload = window.getDashboardSharingSnapshot ? window.getDashboardSharingSnapshot() : { v: "dashboard-1", updatedAt: Date.now(), months: [] };
      var dashboardRes = await sb.from("finance_dashboard_snapshots").upsert({
        owner_id: user.id,
        payload: dashboardPayload,
        updated_at: new Date().toISOString()
      }, { onConflict: "owner_id" });
      if(dashboardRes.error) console.warn("Dashboard sharing sync error:", dashboardRes.error.message);
      // Les copies partagées sont recalculées après chaque sauvegarde : elles
      // ne contiennent que les mois et lignes explicitement choisis.
      try { if(window.FriendsSystem && window.FriendsSystem.refreshMySharedSnapshots) await window.FriendsSystem.refreshMySharedSnapshots(); } catch(e) { console.warn("Granular sharing sync error:", e); }
      
      syncState.dirty = false;
      syncState.lastSync = Date.now();
      syncState.remoteUpdatedAt = cloudUpdatedAt;
      updateSyncStatus();
      return true;
    }catch(e){
      console.warn("Sync push error:", e);
      return false;
    }finally{
      syncState.pushing = false;
      updateSyncStatus();
    }
  }

  // === PULL : tire le snapshot depuis Supabase vers le tableur ===
  async function pullFromCloud(){
    var sb = getSupabase();
    var user = getUser();
    var fs = getFinanceSheet();
    if(!sb || !user || !fs){ return false; }
    if(syncState.pulling || syncState.pushing || syncState.dirty) return false;
    syncState.pulling = true;
    syncState.suppressPush = true; // Eviter la boucle pull -> save -> push
    try{
      var res = await sb.from("finance_snapshots").select("payload,updated_at").eq("owner_id", user.id).maybeSingle();
      if(res.error){ console.warn("Sync pull error:", res.error.message); return false; }
      // Aucun snapshot : premier appareil de ce compte. Le démarrage pourra
      // alors envoyer ses données locales au lieu de les considérer perdues.
      if(!res.data || !res.data.payload) return null;
      var remoteUpdatedAt = String(res.data.updated_at || "");
      if(remoteUpdatedAt && remoteUpdatedAt === syncState.remoteUpdatedAt){
        syncState.lastSync = Date.now();
        updateSyncStatus();
        return true;
      }
      
      var snap = typeof res.data.payload === "string" ? JSON.parse(res.data.payload) : res.data.payload;
      if(!snap || !snap.sheets || !snap.sheets.length){ syncState.pulling = false; syncState.suppressPush = false; return false; }
      if(snap.profile && typeof snap.profile === "object" && !Array.isArray(snap.profile)){
        try { safeStore.setItem("personalFinanceDashboard.setupProfile", JSON.stringify(snap.profile)); window.dispatchEvent(new CustomEvent("gfprofilechange")); } catch(e) {}
      }
      
      if(fs.loadSnapshot){
        // loadSnapshot sauvegarde aussi le cache local après 400 ms. Ce verrou
        // doit rester actif jusque-là, sinon ce pull déclencherait aussitôt un
        // push inutile qui pourrait masquer une modification d'un autre appareil.
        window.__gfSuppressSync = true;
        fs.loadSnapshot({ v: snap.v || "cloud", sheets: snap.sheets, activeSheetId: snap.activeSheetId });
        setTimeout(function(){ window.__gfSuppressSync = false; }, 800);
        if(typeof window.syncDashboardFromFinanceSheet === "function"){
          try{ window.syncDashboardFromFinanceSheet({ silent: true }); }catch(e){}
        }
      }
      
      syncState.lastSync = Date.now();
      syncState.remoteUpdatedAt = remoteUpdatedAt;
      syncState.dirty = false;
      updateSyncStatus();
      return true;
    }catch(e){
      console.warn("Sync pull error:", e);
      return false;
    }finally{
      syncState.pulling = false;
      syncState.suppressPush = false;
    }
  }

  // === Marquer comme dirty (a synchroniser) ===
  function markDirty(){
    if(!getUser()) return;
    if(syncState.suppressPush) return; // Ne pas marquer dirty pendant un pull
    syncState.dirty = true;
    updateSyncStatus();
    if(navigator.onLine){
      if(window.__gf_syncTimer) clearTimeout(window.__gf_syncTimer);
      window.__gf_syncTimer = setTimeout(function(){
        if(syncState.dirty && !syncState.pushing && !syncState.suppressPush) pushToCloud();
      }, 2000);
    }
  }

  function updateSyncStatus(){
    var el = document.getElementById("syncStatusText");
    if(!el) return;
    el.dataset.syncState=syncState.pushing?"syncing":syncState.dirty?"pending":"ready";
    if(!getUser()){ el.textContent = ""; return; }
    if(!navigator.onLine){ el.textContent = "Hors ligne — sync en attente"; return; }
    if(syncState.pushing){ el.textContent = "Synchronisation..."; return; }
    if(syncState.dirty){ el.textContent = "En attente de sync..."; return; }
    if(syncState.lastSync){ var ago = Math.max(0,Math.round((Date.now() - syncState.lastSync) / 1000)); if(ago<15) el.textContent = "Synchronisé à l’instant"; else if(ago<60) el.textContent = "Synchronisé il y a " + ago + " s"; else if(ago<3600) el.textContent = "Synchronisé il y a " + Math.round(ago/60) + " min"; else el.textContent = "Synchronisé"; return; }
    el.textContent = "Prêt à synchroniser";
  }

  // === Sync automatique au retour en ligne ===
  window.addEventListener("online", function(){
    updateSyncStatus();
    if(getUser() && syncState.dirty){
      setTimeout(function(){ if(syncState.dirty && !syncState.pushing && !syncState.suppressPush) pushToCloud(); }, 1000);
    }
  });
  window.addEventListener("offline", function(){ updateSyncStatus(); });

  // Une seule synchronisation est programmée même si Supabase et le module
  // Compte annoncent presque simultanément la restauration de la session.
  function scheduleAccountSync(user, delay){
    if(!user || !user.id) return;
    var changedAccount = syncState.userId !== user.id;
    syncState.userId = user.id;
    if(changedAccount){ syncState.remoteUpdatedAt = ""; syncState.lastSync = 0; syncState.dirty = false; }
    if(syncState.scheduledPull) clearTimeout(syncState.scheduledPull);
    syncState.scheduledPull = setTimeout(async function(){
      syncState.scheduledPull = null;
      var current = getUser();
      if(!current || current.id !== user.id || !navigator.onLine) return;
      var pulled = await pullFromCloud();
      if(pulled === null){
        // Nouveau compte sans snapshot : on conserve et envoie le contenu
        // présent sur l'appareil (tableur, objectifs et notes).
        syncState.dirty = true;
        updateSyncStatus();
        await pushToCloud();
      }else if(pulled === false){ updateSyncStatus(); }
    }, typeof delay === "number" ? delay : 500);
  }

  function clearAccountSync(){
    if(syncState.scheduledPull) clearTimeout(syncState.scheduledPull);
    syncState.scheduledPull = null;
    syncState.userId = "";
    syncState.remoteUpdatedAt = "";
    syncState.dirty = false;
    syncState.lastSync = 0;
    updateSyncStatus();
  }

  function refreshFromCloud(){
    if(document.hidden || !navigator.onLine || !getUser() || syncState.dirty || syncState.pushing || syncState.pulling) return;
    pullFromCloud();
  }

  // === Initialisation ===
  function initSync(){
    window.addEventListener("authStateChanged", function(event){
      var detail = event && event.detail ? event.detail : {};
      if(detail.user) scheduleAccountSync(detail.user, detail.event === "SIGNED_IN" ? 350 : 650);
      else if(detail.event === "SIGNED_OUT") clearAccountSync();
    });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshFromCloud(); });
    window.addEventListener("focus", refreshFromCloud);
    setInterval(refreshFromCloud, 60000);
    updateSyncStatus();
    // Le client Supabase est créé après le chargement de sa configuration.
    // Cette courte attente récupère aussi une session déjà ouverte, cas où
    // l'ancien code ratait le pull initial sur un second appareil.
    var checkInterval = setInterval(function(){
      var user = getUser();
      if(getFinanceSheet() && user){ clearInterval(checkInterval); scheduleAccountSync(user, 250); }
    }, 500);
    setTimeout(function(){ clearInterval(checkInterval); }, 15000);
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", initSync);
  else initSync();

  window.__gfSync = { pushToCloud: pushToCloud, pullFromCloud: pullFromCloud, markDirty: markDirty, updateSyncStatus: updateSyncStatus };
})();
</script>
